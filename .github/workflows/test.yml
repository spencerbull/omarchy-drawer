name: State tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/model.test.cjs
      - run: python3 -m json.tool manifest.json > /dev/null
      - run: bash -n scripts/*
