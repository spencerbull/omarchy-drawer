name: Drawer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/model.test.cjs
      - run: python3 -m json.tool manifest.json > /dev/null
      - run: for script in scripts/* integration/*.sh; do bash -n "$script"; done
      - uses: actions/checkout@v4
        with:
          repository: basecamp/omarchy
          ref: 82652c8bdba65c05954fe6ebd961d90029250a5d
          path: .host
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            shell/plugins/bar/Bar.qml
            shell/plugins/bar/BarModel.js
            shell/Ui/PluginBarApi.qml
            shell/Ui/KeyboardPanel.qml
            shell/Ui/PopupCard.qml
      - run: integration/test-apply.sh "$PWD/.host"
